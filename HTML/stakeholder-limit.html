<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Join - Daily Limit Reached</title>

  <link
    rel="stylesheet"
    href="../CSS/stakeholder-limit.css"
  >
</head>

<body>

  <main class="limit-page">

    <!-- LOGO -->
    <a href="./welcome.html" class="logo-link">
      <img
        src="../Assets/Join_logo_blue.png"
        alt="Join Logo"
        class="join-logo"
      >
    </a>


    <!-- BACK -->
    <a
      href="./welcome.html"
      class="back-button"
      aria-label="Back"
    >
      ←
    </a>


    <!-- COUNTER -->
    <div class="request-counter">
      <strong>10 of 10</strong>
      <span>requests used today</span>
    </div>


    <!-- TITLE -->
    <h1>Welcome</h1>


    <!-- CONTENT -->
    <section class="limit-content">

      <div class="limit-text">

        <div class="limit-warning">
          The daily 10-request limit has been reached!
        </div>

        <p>
          Need more? No worries — you can still send emails,
          but our team will review them manually instead of
          using AI to create tickets.
        </p>

        <a
          href="./email-mask.html"
          class="send-email-button"
        >
          Send an email
          <span>✓</span>
        </a>

      </div>


      <!-- ILLUSTRATION -->
      <div class="limit-image">

        <img
          src="../Assets/stakeholder-limit-illustration.png"
          alt="Join Kanban illustration"
        >

      </div>

    </section>


    <!-- FOOTER -->
    <footer>

      <a href="./privacy-policy.html">
        Privacy Policy
      </a>

      <a href="./legal-notice.html">
        Legal notice
      </a>

    </footer>

  </main>

</body>
</html>
