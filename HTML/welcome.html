<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Join - Welcome</title>

  <link
    rel="stylesheet"
    href="../CSS/welcome.css"
  >
</head>

<body>

  <main class="welcome-page">

    <section class="welcome-card">

      <h1>Welcome</h1>

      <div class="headline-line"></div>

      <p class="welcome-description">
        Pick the option that suits your role:
        create a request as a stakeholder or log in
        if you're part of the team.
      </p>


      <div class="role-container">

        <!-- STAKEHOLDER -->
        <div class="role-box">

          <div class="role-title">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M8 7V5.5C8 4.7 8.7 4 9.5 4h5c.8 0 1.5.7 1.5 1.5V7"
              />

              <rect
                x="4"
                y="7"
                width="16"
                height="12"
                rx="1"
              />
            </svg>

            <span>
              Are you a stakeholder?
            </span>

          </div>

          <a
            href="./stakeholder.html"
            class="request-button"
          >
            Create request
          </a>

        </div>


        <!-- TEAM MEMBER -->
        <div class="role-box">

          <div class="role-title">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                cx="9"
                cy="8"
                r="3"
              />

              <path
                d="M3.5 18c.4-3.3 2.4-5 5.5-5s5.1 1.7 5.5 5"
              />

              <circle
                cx="17"
                cy="9"
                r="2.2"
              />

              <path
                d="M15.5 13.5c2.9-.3 4.7 1.2 5 4"
              />
            </svg>

            <span>
              Are you a team member?
            </span>

          </div>

          <a
            href="../index.html"
            class="login-button"
          >
            Member log in
          </a>

        </div>

      </div>

    </section>


    <footer class="welcome-footer">

      <a href="./privacy-policy.html">
        Privacy Policy
      </a>

      <a href="./legal-notice.html">
        Legal notice
      </a>

    </footer>

  </main>

</body>
</html>
