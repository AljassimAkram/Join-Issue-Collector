<!doctype html>
<html lang="dn">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="./Assets/favIcon.png" />
    <title>Join - Welcome</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./CSS/login.css" />

    <link rel="stylesheet" href="../CSS/welcome.css" />
  </head>

  <body
    id="body"
    onload="
      logOut();
      init();
    "
  >
    <div class="animation" id="animation">
      <img class="welcome-img" src="./Assets/Join_logo_big.png" alt="" />
      <img class="welcome-img-mobile" src="./Assets/Join_logo.png" alt="" />
    </div>

    <main class="welcome-page">
      <section class="welcome-card">
        <h1>Welcome</h1>

        <div class="headline-line"></div>

        <p class="welcome-description">
          Pick the option that suits your role: create a request as a
          stakeholder or log in if you're part of the team.
        </p>

        <div class="role-container">
          <!-- STAKEHOLDER -->
          <div class="role-box">
            <div class="role-title">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 7V5.5C8 4.7 8.7 4 9.5 4h5c.8 0 1.5.7 1.5 1.5V7" />

                <rect x="4" y="7" width="16" height="12" rx="1" />
              </svg>

              <span> Are you a stakeholder? </span>
            </div>

            <a href="./HTML/stakeholder.html" class="request-button">
              Create request
            </a>
          </div>

          <!-- TEAM MEMBER -->
          <div class="role-box">
            <div class="role-title">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3" />

                <path d="M3.5 18c.4-3.3 2.4-5 5.5-5s5.1 1.7 5.5 5" />

                <circle cx="17" cy="9" r="2.2" />

                <path d="M15.5 13.5c2.9-.3 4.7 1.2 5 4" />
              </svg>

              <span> Are you a team member? </span>
            </div>

            <a href="./HTML/welcome.html" class="login-button">
              Member log in
            </a>
          </div>
        </div>
      </section>

      <footer class="welcome-footer">
        <a href="./privacy-policy.html"> Privacy Policy </a>

        <a href="./legal-notice.html"> Legal notice </a>
      </footer>
    </main>
    <script src="./script.js"></script>
    <script src="./JS/login.js"></script>
    <script src="./JS/template.js"></script>
    <script src="./JS/nav-bar.js"></script>
  </body>
</html>
